<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <filter id="card-shadow-monsooned-malabar" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Archival Tasting Card Background -->
  <g filter="url(#card-shadow-monsooned-malabar)">
    <rect x="120" y="90" width="560" height="820" rx="16" fill="#FDFCFA" stroke="#E2DCD0" stroke-width="2" />
    <rect x="136" y="106" width="528" height="788" rx="12" fill="none" stroke="#EAE4D8" stroke-width="1" />

    <!-- Card Header -->
    <text x="400" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="4" fill="#8C3A14">KILN &amp; LEAF</text>
    <text x="400" y="180" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#786F66">CUPPING ARCHIVE &amp; TASTING CARD</text>
    <line x1="200" y1="198" x2="600" y2="198" stroke="#E2DCD0" stroke-width="1" />

    <!-- Product Title -->
    <text x="400" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="600" fill="#161412">Monsooned Malabar AA</text>

    <!-- Origin & Specs Bar -->
    <rect x="180" y="340" width="440" height="42" rx="6" fill="#F7F4EE" />
    <text x="210" y="366" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#4E473F">ORIGIN: India Malabar Coast</text>
    <text x="590" y="366" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#786F66">250g</text>

    <!-- Tasting Notes Section -->
    <text x="400" y="434" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#786F66">CURATED FLAVOR PROFILE</text>
    
      <g transform="translate(160, 460)">
        <rect x="0" y="0" width="112" height="34" rx="17" fill="#F4EFE6" stroke="#E2DCD0" stroke-width="1.5" />
        <text x="56" y="21" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4E473F">Dark cocoa</text>
      </g>

      <g transform="translate(285, 460)">
        <rect x="0" y="0" width="112" height="34" rx="17" fill="#F4EFE6" stroke="#E2DCD0" stroke-width="1.5" />
        <text x="56" y="21" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4E473F">Bakers spice</text>
      </g>

      <g transform="translate(410, 460)">
        <rect x="0" y="0" width="112" height="34" rx="17" fill="#F4EFE6" stroke="#E2DCD0" stroke-width="1.5" />
        <text x="56" y="21" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4E473F">Malted earth</text>
      </g>

    <line x1="180" y1="540" x2="620" y2="540" stroke="#E2DCD0" stroke-width="1" />

    
    <!-- Roast Meter Block -->
    <text x="400" y="580" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#786F66">ROAST LEVEL (4 / 5)</text>
    <g transform="translate(0, 10)">
      
      <circle cx="364" cy="606" r="4.5" fill="#8C3A14" stroke="#8C3A14" stroke-width="1.5" />
    
      <circle cx="382" cy="606" r="4.5" fill="#8C3A14" stroke="#8C3A14" stroke-width="1.5" />
    
      <circle cx="400" cy="606" r="4.5" fill="#8C3A14" stroke="#8C3A14" stroke-width="1.5" />
    
      <circle cx="418" cy="606" r="4.5" fill="#8C3A14" stroke="#8C3A14" stroke-width="1.5" />
    
      <circle cx="436" cy="606" r="4.5" fill="none" stroke="#8C3A14" stroke-width="1.5" />
    
    </g>
    

    <line x1="180" y1="656" x2="620" y2="656" stroke="#E2DCD0" stroke-width="1" />

    <!-- Brew Recipe Block -->
    <text x="400" y="694" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#786F66">BREW &amp; EXTRACTION RECIPE</text>
    <rect x="180" y="714" width="440" height="54" rx="8" fill="#F7F4EE" stroke="#E2DCD0" stroke-width="1" />
    <text x="400" y="746" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#161412">South Indian filter, Moka pot, or French press</text>

    <!-- Bottom seal -->
    <text x="400" y="830" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" letter-spacing="2" fill="#786F66">AUTHENTIC SPECIALTY GRADE · DIRECT ROASTER SELECTION</text>
  </g>
</svg>