<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" fill="none">
  <defs>
    <radialGradient id="shadow-assam-breakfast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tin-body-assam-breakfast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1918" />
      <stop offset="15%" stop-color="#2B2927" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#2B2927" />
      <stop offset="100%" stop-color="#1B1918" />
    </linearGradient>
    <linearGradient id="lid-sheen-assam-breakfast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1918" />
      <stop offset="30%" stop-color="#D48B47" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#D48B47" />
      <stop offset="100%" stop-color="#1B1918" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="960" rx="220" ry="26" fill="url(#shadow-assam-breakfast)" />

  <!-- Tin Cylinder Body (body 250-950, lid+dome 110-250) -->
  <g>
    <rect x="240" y="250" width="320" height="700" rx="18" fill="#2B2927" />
    <rect x="240" y="250" width="320" height="700" rx="18" fill="url(#tin-body-assam-breakfast)" />

    <!-- Top Rim Collar -->
    <rect x="234" y="232" width="332" height="28" rx="4" fill="#D48B47" stroke="#1B1918" stroke-width="1" />
    <rect x="234" y="232" width="332" height="28" rx="4" fill="url(#lid-sheen-assam-breakfast)" opacity="0.6" />

    <!-- Stepped Lid Dome -->
    <path d="M 244 232 L 260 160 Q 400 148 540 160 L 556 232 Z" fill="#2B2927" stroke="#1B1918" stroke-width="1" />
    <path d="M 244 232 L 260 160 Q 400 148 540 160 L 556 232 Z" fill="url(#tin-body-assam-breakfast)" opacity="0.75" />

    <!-- Lid Knob -->
    <rect x="352" y="136" width="96" height="28" rx="7" fill="#D48B47" />
    <ellipse cx="400" cy="136" rx="48" ry="9" fill="#FFFFFF" fill-opacity="0.25" />

    <!-- Embossed trim lines -->
    <line x1="240" y1="298" x2="560" y2="298" stroke="#D48B47" stroke-opacity="0.4" stroke-width="1.5" />
    <line x1="240" y1="890" x2="560" y2="890" stroke="#D48B47" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Elegant Label Plate -->
    <g filter="drop-shadow(0 4px 10px rgba(0,0,0,0.12))">
      <rect x="268" y="330" width="264" height="440" rx="8" fill="#F7F4EE" stroke="#D48B47" stroke-opacity="0.5" stroke-width="1.5" />
      <rect x="276" y="338" width="248" height="424" rx="5" fill="none" stroke="#D48B47" stroke-opacity="0.22" stroke-width="1" />

      <path d="M 484 330 L 532 330 L 532 378 Z" fill="#D48B47" opacity="0.18" />

      <!-- Wordmark -->
      <text x="400" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="4" fill="#161412">KILN &amp; LEAF</text>
      <line x1="306" y1="394" x2="494" y2="394" stroke="#D48B47" stroke-opacity="0.3" stroke-width="1" />

      <!-- Product Name -->
      <text x="400" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#161412">Assam Mangalam</text>
      <text x="400" y="532" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#161412">Golden Tips</text>

      <line x1="320" y1="612" x2="480" y2="612" stroke="#D48B47" stroke-opacity="0.3" stroke-width="1" />

      <!-- Origin & Weight -->
      <text x="400" y="648" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#161412">India Assam</text>
      <text x="400" y="672" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" fill="#786F66">Net Wt. 250g</text>
    </g>
  </g>
</svg>